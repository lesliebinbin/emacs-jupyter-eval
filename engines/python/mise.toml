[tools]
python = "3.12"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }
_.python.venv = { path = ".venv", create = true, uv_create_args = ["--seed"] }

[tasks.setup]
description = "Install the Python Jupyter engine"
run = "python -m pip install -r requirements.txt"

[tasks.register]
description = "Register the Python engine as a user kernelspec"
depends = [":setup"]
run = """
python -m ipykernel install --user \
  --name jupyter-eval-python \
  --display-name "Jupyter Eval (Python)"
"""
