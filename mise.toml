monorepo_root = true

[monorepo]
config_roots = ["adapters/emacs", "broker", "engines/python", "renderer"]
lockfile = false

[tasks.setup]
description = "Install broker, engine, and renderer dependencies"
run = [
  "mise //broker:setup",
  "mise //engines/python:setup",
  "mise //renderer:setup",
]

[tasks.check]
description = "Check the broker and renderer"
run = [
  "mise //broker:check",
  "mise //renderer:check",
]
